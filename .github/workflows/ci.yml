name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev extras only; tests run fully offline)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (offline fake LLM, hash embeddings)
        run: pytest
      - name: Offline demo smoke test
        run: SENTINEL_STORAGE_DIR=/tmp/s sentinel demo
