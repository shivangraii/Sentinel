[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: multi-agent deep-research platform (LangGraph, hybrid RAG, reflection loop, evaluation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain-core>=0.3.0",
  "chromadb>=0.5.0",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.0.0"]
groq = ["langchain-groq>=0.2.0"]
ollama = ["langchain-ollama>=0.2.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
embeddings = ["sentence-transformers>=3.0.0"]
search = ["ddgs>=9.0.0"]
ui = ["streamlit>=1.35"]
eval = ["ragas>=0.2.0", "datasets>=2.19", "langchain-huggingface>=0.1.0"]
observability = ["langfuse>=2.0.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
all = [
  "sentinel[gemini,groq,ollama,anthropic,embeddings,search,ui,observability,dev]",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP007", "UP045"]
